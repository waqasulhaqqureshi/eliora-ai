  <marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0072B2"/></marker>
</defs>
  <text x="40" y="56" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#1a1a1a"><tspan x="40" dy="0">Fig. 2  </tspan></text><text x="177.76" y="56" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#1a1a1a"><tspan x="177.76" dy="0">Architecture and data boundary: what stays on the phone and what touches the network</tspan></text><rect x="50" y="100" width="1090" height="690" rx="16" fill="#fafafa" stroke="#555555" stroke-width="2" stroke-dasharray="10 6"/><text x="76" y="138" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#555555"><tspan x="76" dy="0">On the phone</tspan></text><rect x="90" y="170" width="220" height="90" rx="9" fill="#E3F4EC" stroke="#009E73" stroke-width="2"/><text x="200" y="208.8" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#1a1a1a"><tspan x="200" dy="0">Chat UI</tspan></text><text x="200" y="236.55" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#555555"><tspan x="200" dy="0">streaming, code blocks</tspan></text><rect x="350" y="170" width="220" height="90" rx="9" fill="#E3F4EC" stroke="#009E73" stroke-width="2"/><text x="460" y="196.925" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#1a1a1a"><tspan x="460" dy="0">System prompt</tspan><tspan x="460" dy="23.75">engine</tspan></text><text x="460" y="248.425" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#555555"><tspan x="460" dy="0">per model family</tspan></text><rect x="610" y="170" width="250" height="90" rx="9" fill="#E3F4EC" stroke="#009E73" stroke-width="2"/><text x="735" y="208.475" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#1a1a1a"><tspan x="735" dy="0">flutter_local_agent_kit</tspan></text><text x="735" y="234.975" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#555555"><tspan x="735" dy="0">inference and sessions</tspan></text><rect x="900" y="170" width="210" height="90" rx="9" fill="#E3F4EC" stroke="#009E73" stroke-width="2"/><text x="1005" y="208.8" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#1a1a1a"><tspan x="1005" dy="0">Model files</tspan></text><text x="1005" y="236.55" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#555555"><tspan x="1005" dy="0">GGUF, on the device</tspan></text><path d="M310 215 H350" fill="none" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#ah)" stroke-linejoin="round"/><path d="M570 215 H610" fill="none" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#ah)" stroke-linejoin="round"/><path d="M860 215 H900" fill="none" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#ah)" stroke-linejoin="round"/><rect x="90" y="330" width="220" height="90" rx="9" fill="#E3F4EC" stroke="#009E73" stroke-width="2"/><text x="200" y="368.8" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#1a1a1a"><tspan x="200" dy="0">Session store</tspan></text><text x="200" y="396.55" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#555555"><tspan x="200" dy="0">saved chats</tspan></text><rect x="350" y="330" width="220" height="90" rx="9" fill="#E3F4EC" stroke="#009E73" stroke-width="2"/><text x="460" y="368.8" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#1a1a1a"><tspan x="460" dy="0">Knowledge base</tspan></text><text x="460" y="396.55" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#555555"><tspan x="460" dy="0">your files, citations</tspan></text><rect x="610" y="330" width="250" height="90" rx="9" fill="#E3F4EC" stroke="#009E73" stroke-width="2"/><text x="735" y="368.8" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#1a1a1a"><tspan x="735" dy="0">RAM check</tspan></text><text x="735" y="396.55" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#555555"><tspan x="735" dy="0">tier and compatibility</tspan></text><rect x="900" y="330" width="210" height="90" rx="9" fill="#F9E3D6" stroke="#D55E00" stroke-width="2" stroke-dasharray="7 5"/><text x="1005" y="368.15" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#1a1a1a"><tspan x="1005" dy="0">Download manager</tspan></text><text x="1005" y="393.4" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#555555"><tspan x="1005" dy="0">progress, cancel</tspan></text><path d="M200 330 V260" fill="none" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#ah)" stroke-linejoin="round"/><path d="M200 260 V330" fill="none" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#ah)" stroke-linejoin="round"/><path d="M1005 330 V260" fill="none" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#ah)" stroke-linejoin="round"/><rect x="900" y="490" width="210" height="90" rx="9" fill="#F9E3D6" stroke="#D55E00" stroke-width="2" stroke-dasharray="7 5"/><text x="1005" y="528.475" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#1a1a1a"><tspan x="1005" dy="0">License listener</tspan></text><text x="1005" y="554.975" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#555555"><tspan x="1005" dy="0">reads is_locked</tspan></text><rect x="900" y="640" width="210" height="90" rx="9" fill="#F9E3D6" stroke="#D55E00" stroke-width="2" stroke-dasharray="7 5"/><text x="1005" y="678.475" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#1a1a1a"><tspan x="1005" dy="0">MCP client</tspan></text><text x="1005" y="704.975" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#555555"><tspan x="1005" dy="0">optional, you choose</tspan></text><rect x="90" y="490" width="740" height="240" rx="12" fill="#E3F4EC" stroke="#009E73" stroke-width="2.5"/><text x="114" y="528" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#1a1a1a"><tspan x="114" dy="0">Stays on the phone</tspan></text><text x="114" y="566" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#1a1a1a"><tspan x="114" dy="0">•  Your messages and the model’s replies</tspan><tspan x="114" dy="28.5">•  Saved chats</tspan><tspan x="114" dy="28.5">•  Files you add to the knowledge base</tspan><tspan x="114" dy="28.5">•  Model files after they are downloaded</tspan></text><text x="114" y="706" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#555555" font-style="italic"><tspan x="114" dy="0">Exception: an MCP server you connect yourself receives what you send it.</tspan></text><rect x="1260" y="330" width="290" height="90" rx="9" fill="#FCEFD2" stroke="#E69F00" stroke-width="2"/><text x="1405" y="369.125" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#1a1a1a"><tspan x="1405" dy="0">Hugging Face</tspan></text><text x="1405" y="398.125" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#555555"><tspan x="1405" dy="0">model file, first use of each model</tspan></text><rect x="1260" y="490" width="290" height="90" rx="9" fill="#FCEFD2" stroke="#E69F00" stroke-width="2"/><text x="1405" y="529.125" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#1a1a1a"><tspan x="1405" dy="0">Firebase Firestore</tspan></text><text x="1405" y="558.125" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#555555"><tspan x="1405" dy="0">one document: license/status</tspan></text><rect x="1260" y="640" width="290" height="90" rx="9" fill="#FCEFD2" stroke="#E69F00" stroke-width="2"/><text x="1405" y="679.125" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#1a1a1a"><tspan x="1405" dy="0">Your MCP server</tspan></text><text x="1405" y="708.125" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#555555"><tspan x="1405" dy="0">only if you connect one</tspan></text><path d="M1260 375 H1110" fill="none" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#ah)" stroke-linejoin="round"/><text x="1185" y="360" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#555555"><tspan x="1185" dy="0">download</tspan></text><path d="M1260 535 H1110" fill="none" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#ah)" stroke-linejoin="round"/><text x="1185" y="520" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#555555"><tspan x="1185" dy="0">is_locked</tspan></text><path d="M1110 685 H1260" fill="none" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#ah)" stroke-linejoin="round"/><path d="M1260 700 H1110" fill="none" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#ah)" stroke-linejoin="round"/><text x="1185" y="670" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#555555"><tspan x="1185" dy="0">requests</tspan></text><rect x="50" y="822" width="26" height="18" rx="4" fill="#E3F4EC" stroke="#009E73" stroke-width="2"/><text x="86" y="837" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#1a1a1a"><tspan x="86" dy="0">on-device component</tspan></text><rect x="290" y="822" width="26" height="18" rx="4" fill="#F9E3D6" stroke="#D55E00" stroke-width="2" stroke-dasharray="5 3"/><text x="326" y="837" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#1a1a1a"><tspan x="326" dy="0">component that uses the network</tspan></text><rect x="610" y="822" width="26" height="18" rx="4" fill="#FCEFD2" stroke="#E69F00" stroke-width="2"/><text x="646" y="837" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#1a1a1a"><tspan x="646" dy="0">external service</tspan></text><text x="850" y="837" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#D55E00"><tspan x="850" dy="0">The license flag is a remote on/off switch for the app; it does not read chats.</tspan></text>
</svg>
