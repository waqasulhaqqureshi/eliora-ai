<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 870" width="1600" height="870" role="img" aria-label="Architecture of Eliora AI and its data boundary">
  <rect width="1600" height="870" fill="#ffffff"/>
  <defs>
