<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 700" width="1560" height="700" role="img" aria-label="Flow from a message to a reply, all on the phone">
  <rect width="1560" height="700" fill="#ffffff"/>
  <defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1a1a1a"/></marker>
  <marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0072B2"/></marker>
</defs>
  <text x="40" y="56" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#1a1a1a"><tspan x="40" dy="0">Fig. 3  </tspan></text><text x="177.76" y="56" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#1a1a1a"><tspan x="177.76" dy="0">From a message to a reply: every step runs on the phone</tspan></text><rect x="40" y="250" width="240" height="130" rx="9" fill="#E3F4EC" stroke="#009E73" stroke-width="2"/><text x="160" y="296.925" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#1a1a1a"><tspan x="160" dy="0">You type a</tspan><tspan x="160" dy="23.75">message</tspan></text><text x="160" y="348.425" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#555555"><tspan x="160" dy="0">text, image or file</tspan></text><rect x="330" y="250" width="240" height="130" rx="9" fill="#E3F4EC" stroke="#009E73" stroke-width="2"/><text x="450" y="287.55" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#1a1a1a"><tspan x="450" dy="0">System prompt</tspan><tspan x="450" dy="23.75">engine</tspan></text><text x="450" y="339.05" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#555555"><tspan x="450" dy="0">short prompts for tiny</tspan><tspan x="450" dy="18.75">models, richer for large</tspan></text><rect x="620" y="250" width="240" height="130" rx="9" fill="#E3F4EC" stroke="#009E73" stroke-width="2"/><text x="740" y="287.55" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#1a1a1a"><tspan x="740" dy="0">History</tspan><tspan x="740" dy="23.75">pruning</tspan></text><text x="740" y="339.05" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#555555"><tspan x="740" dy="0">keeps the chat within</tspan><tspan x="740" dy="18.75">the model's context</tspan></text><rect x="910" y="250" width="240" height="130" rx="9" fill="#E3F4EC" stroke="#009E73" stroke-width="2"/><text x="1030" y="287.55" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#1a1a1a"><tspan x="1030" dy="0">On-device</tspan><tspan x="1030" dy="23.75">inference</tspan></text><text x="1030" y="339.05" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#555555"><tspan x="1030" dy="0">quantized GGUF model,</tspan><tspan x="1030" dy="18.75">tokens stream out</tspan></text><rect x="1200" y="250" width="240" height="130" rx="9" fill="#E3F4EC" stroke="#009E73" stroke-width="2"/><text x="1320" y="299.425" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#1a1a1a"><tspan x="1320" dy="0">Chat bubble</tspan></text><text x="1320" y="327.175" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#555555"><tspan x="1320" dy="0">streaming text, citations,</tspan><tspan x="1320" dy="18.75">copy, read aloud</tspan></text><path d="M280 315 H330" fill="none" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#ah)" stroke-linejoin="round"/><path d="M570 315 H620" fill="none" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#ah)" stroke-linejoin="round"/><path d="M860 315 H910" fill="none" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#ah)" stroke-linejoin="round"/><path d="M1150 315 H1200" fill="none" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#ah)" stroke-linejoin="round"/><rect x="910" y="100" width="240" height="90" rx="9" fill="#E3F4EC" stroke="#009E73" stroke-width="2"/><text x="1030" y="138.8" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#1a1a1a"><tspan x="1030" dy="0">Knowledge base</tspan></text><text x="1030" y="166.55" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#555555"><tspan x="1030" dy="0">optional: your files</tspan></text><path d="M1030 190 V250" fill="none" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#ah)" stroke-linejoin="round"/><text x="1048" y="208" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#555555"><tspan x="1048" dy="0">retrieved passages</tspan></text><rect x="1200" y="470" width="240" height="90" rx="9" fill="#E3F4EC" stroke="#009E73" stroke-width="2"/><text x="1320" y="508.8" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#1a1a1a"><tspan x="1320" dy="0">Session store</tspan></text><text x="1320" y="536.55" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#555555"><tspan x="1320" dy="0">chat saved on the device</tspan></text><path d="M1320 380 V470" fill="none" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#ah)" stroke-linejoin="round"/><rect x="30" y="220" width="1470" height="190" rx="14" fill="none" stroke="#555555" stroke-width="2" stroke-dasharray="10 6"/><text x="48" y="436" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#555555"><tspan x="48" dy="0">No network is used for these steps once a model has been downloaded.</tspan></text><text x="40" y="640" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#555555"><tspan x="40" dy="0">Not shown: model download (first use of each model), the license flag in Firestore, and the optional MCP server. See Fig. 2.</tspan></text>
</svg>
